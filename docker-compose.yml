services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce-conversion-backend
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ecommerce-conversion-frontend
    environment:
      API_URL: "http://backend:8001"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
